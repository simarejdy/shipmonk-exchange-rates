spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

shipmonk:
  fixer:
    api-key: "test-key"
    base-url: "http://localhost:8080"
    capabilities:
      allow-custom-base: true
    target-currencies:
      - USD
      - CZK
      - GBP
      - EUR
      - PLN
